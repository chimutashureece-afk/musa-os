<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b4427" />
    <title>Musa OS — School Management</title>
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
    <script>
      try {
        var t = localStorage.getItem('ace-theme');
        var r = document.documentElement, dt = r.getAttribute('data-theme');
        var apply = function () {
          var saved = null; try { saved = localStorage.getItem('ace-theme'); } catch (e) {}
          var d = r.getAttribute('data-theme');
          var dark = saved ? saved === 'dark' : d ? d === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
          r.classList.toggle('dark', dark);
        };
        apply();
        // follow the host page's theme (when embedded) and the OS setting, unless the user picked one
        new MutationObserver(apply).observe(r, { attributes: true, attributeFilter: ['data-theme'] });
        matchMedia('(prefers-color-scheme: dark)').addEventListener('change', apply);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
