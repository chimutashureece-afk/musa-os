<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Musa OS</title>
<style>
  :root { color-scheme: light dark; }
  body { margin:0; height:100vh; display:grid; place-items:center; font-family: "Segoe UI", system-ui, sans-serif; background:#f4f7f5; color:#131b18; }
  @media (prefers-color-scheme: dark) { body { background:#0e1412; color:#dfe5e2; } p { color:#8f9f97 !important; } }
  main { max-width: 420px; text-align:center; padding: 24px; }
  img { width:64px; height:64px; }
  h1 { font-size: 22px; margin: 18px 0 8px; }
  p { color:#4a5953; line-height:1.5; margin:0 0 22px; }
  button { font: inherit; font-weight:600; background:#0c532c; color:#fff; border:0; border-radius:10px; padding:10px 20px; cursor:pointer; }
  button:hover { background:#0b4427; }
</style></head>
<body><main>
  <img src="build/icon.png" alt="">
  <h1>Musa OS needs the internet the first time</h1>
  <p>Connect once so the app can download your school. After that it keeps working offline and syncs when you’re back online.</p>
  <button id="retry">Try again</button>
</main>
<script>
  const url = new URLSearchParams(location.search).get('url');
  const go = () => { if (url) location.href = url; };
  document.getElementById('retry').onclick = go;
  addEventListener('online', go);
</script>
</body></html>
