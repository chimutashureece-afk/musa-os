<!doctype html>
<html><head><meta charset="utf-8"><title>Musa OS</title>
<style>
  html, body { margin:0; height:100%; background:#032619; color:#fff; font-family:"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif; -webkit-user-select:none; user-select:none; cursor:default; -webkit-app-region: drag; }
  body { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; }
  img { width:72px; height:72px; animation: pop .6s cubic-bezier(.34,1.56,.64,1) both; }
  h1 { margin:0; font-size:22px; font-weight:600; letter-spacing:-.01em; }
  h1 span { color:#33bb68; }
  .bar { width:140px; height:3px; border-radius:3px; background:rgba(255,255,255,.12); overflow:hidden; }
  .bar i { display:block; width:40%; height:100%; background:#33bb68; border-radius:3px; animation: slide 1.1s ease-in-out infinite; }
  p { margin:0; font-size:12px; color:rgba(255,255,255,.55); }
  @keyframes slide { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
  @keyframes pop { from { transform: scale(.6); opacity:0; } to { transform:none; opacity:1; } }
</style></head>
<body>
  <img src="build/icon.png" alt="">
  <h1>Musa<span>OS</span></h1>
  <div class="bar"><i></i></div>
  <p>Opening your school…</p>
</body></html>
